        function formatDateHeading(dateString) {
            if (!dateString) return '';
            let parseStr = dateString;
            if (!parseStr.endsWith('Z') && !parseStr.includes('+') && !parseStr.includes('-', 10)) {
                parseStr += 'Z';
            }
            const messageDate = new Date(parseStr);
            if (isNaN(messageDate)) return dateString.split(' ')[0];

            const today = new Date();
            if (messageDate.toDateString() === today.toDateString()) return 'Today';

            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);
            if (messageDate.toDateString() === yesterday.toDateString()) return 'Yesterday';

            return messageDate.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
        }

        function formatMessageTime(dateString) {
            if (!dateString) return '';
            let parseStr = dateString;
            if (!parseStr.endsWith('Z') && !parseStr.includes('+') && !parseStr.includes('-', 10)) {
                parseStr += 'Z';
            }
            const messageDate = new Date(parseStr);
            if (isNaN(messageDate)) return dateString.substring(11, 16);

            return messageDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        // Audio Player Controls & Interactive Waveform Logic
        function toggleAudio(audioId, btn) {
            const audio = document.getElementById(audioId);
            const timeLabel = document.getElementById('time-' + audioId);
            
            if (audio.paused) {
                // Pause all other playing audio elements
                document.querySelectorAll('audio').forEach(a => {
                    if (a.id !== audioId && !a.paused) {
                        a.pause();
                        const otherBtn = document.querySelector(`button[onclick*="${a.id}"]`);
                        if (otherBtn) otherBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                    }
                });

                audio.play();
                btn.innerHTML = '<svg viewBox="0 0 24 24" style="margin-left: 0;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; // Pause icon
            } else {
                audio.pause();
                btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'; // Play icon
            }

            audio.ontimeupdate = () => {
                const mins = Math.floor(audio.currentTime / 60);
                const secs = Math.floor(audio.currentTime % 60);
                timeLabel.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            audio.onended = () => {
                btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
                timeLabel.textContent = '0:00';
            };
        }

            const audio = document.getElementById(audioId);
            if (!audio.duration) return;
            const rect = event.currentTarget.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const width = rect.width;
            audio.currentTime = (clickX / width) * audio.duration;
        }

            }
        });

        searchBox.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = rawMessages.filter(m => 
                (m.text && m.text.toLowerCase().includes(term)) || 
                (m.sender_name && m.sender_name.toLowerCase().includes(term))
            );
            renderMessages(filtered);
        });

        renderMessages(rawMessages);
    </script>
</body>
</html>
